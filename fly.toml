# Fly.io ayarları - Selam
# Uygulama adı dünya genelinde benzersiz olmak zorundadır; gerekirse değiştir.
app = "selam-eymen-0540"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
